# Fly config for the API. The static site is on Pages; this serves /api/* only.
#
# One machine stays up. Nothing on the landing page touches this service: the map,
# the week ahead and the accuracy page are static files, and the page probes
# /api/health after rendering rather than before. Only "Forecast this drive" needs
# the API -- but a cold start is far too slow to put in front of that click.
#
# Measured on Fly, twice, on 2026-08-28: osrm-routed answers 76s after boot. It
# reads a ~930 MB graph off cold storage on a shared-cpu-1x. The 1s figure this
# file used to quote was measured against a warm local page cache and does not
# describe a Fly cold start. Scaling to zero meant every idle visitor waited 76s
# behind a "Route planning unavailable" banner, so we no longer scale to zero.
#
# Fly clamps http_service check grace_period to 60s, so it cannot cover the 76s
# load. That is survivable -- the check goes warning, then passes once OSRM is up,
# and the entrypoint waits OSRM_WAIT (300s) rather than exiting -- but it is why
# a restart still shows one failing check for about a minute.

app = "bay-commute-forecast"
primary_region = "sjc"

[build]
  # This file lives at the repo root on purpose. flyctl resolves the dockerfile
  # path relative to the config file, and the build context is the config file's
  # directory, so a fly.toml inside deploy/ makes the two irreconcilable: the
  # image has to COPY forecast/ and site/, which are at the root.
  dockerfile = "deploy/Dockerfile"

[env]
  SERVE_DIR = "/data/serve"
  STATIONS_DIR = "/data/stations"
  HOST = "0.0.0.0"
  PORT = "8080"
  BEHIND_PROXY = "1"
  REFRESH_MIN = "60"
  # Change both if you fork this or the Fly app name is taken.
  ALLOW_ORIGIN = "https://pu-suo.github.io"
  SERVE_URL = "https://pu-suo.github.io/bay-commute-forecast/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
