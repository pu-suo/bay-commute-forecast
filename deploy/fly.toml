# Fly config for the API. The static site is on Pages; this serves /api/* only.
#
# The machine stops when idle. Nothing on the landing page touches this service:
# the map, the week ahead and the accuracy page are static files, and the page
# probes /api/health after rendering rather than before. So a cold start is only
# ever paid by someone who clicks "Forecast this drive" on an idle app, and it
# costs a few seconds rather than a blank screen.
#
# Measured in the container: osrm-routed ready in 1s, API up immediately after.
# Fly's VM start adds about a second on top.

app = "bay-commute-forecast"
primary_region = "sjc"

[build]
  # Relative to the build context, which is the repo root: the image copies
  # forecast/ and site/, so deploying from inside deploy/ cannot work.
  dockerfile = "deploy/Dockerfile"

[env]
  SERVE_DIR = "/data/serve"
  STATIONS_DIR = "/data/stations"
  HOST = "0.0.0.0"
  PORT = "8080"
  BEHIND_PROXY = "1"
  REFRESH_MIN = "60"
  # Change both if you fork this or the Fly app name is taken.
  ALLOW_ORIGIN = "https://pu-suo.github.io"
  SERVE_URL = "https://pu-suo.github.io/bay-commute-forecast/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
